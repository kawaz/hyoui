<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="hyoui">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="/assets/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/assets/icon.svg">
<link rel="apple-touch-icon" href="/assets/icon.svg">
<title>hyoui — session</title>
<link rel="stylesheet" href="/assets/vendor/xterm.css">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body class="session-page">
<header>
  <h1><a href="/">← sessions</a> / <span id="sid"></span></h1>
  <p class="meta">
    <!-- 固定幅要素を先 (端) に配置してレイアウトシフトを防ぐ (task 3):
         status の text は末尾に置き、幅変動が後続要素を押さないようにする。
         reload ボタンは PWA (standalone) でアドレスバー無し時の全ページリロード用 (task 4)。 -->
    <button id="reload" class="reload-btn" type="button" title="reload page (PWA 用)" aria-label="reload page">↻</button>
    <button id="refresh" type="button">refresh</button>
    <label><input type="checkbox" id="auto" checked> auto refresh</label>
    <label title="viewport 変化に追従して daemon 側 PTY の cols/rows も resize する (実 TUI が再レイアウトされる)"><input type="checkbox" id="autoResize"> auto-resize (PTY)</label>
    <span class="sep">·</span>
    <span id="size" class="meta">80x24</span>
    <span class="sep">·</span>
    <span id="status" class="status-text">loading…</span>
  </p>
</header>
<main>
  <div id="stoppedBanner" class="stopped-banner" hidden>
    <span>child is stopped (SIGSTOP). resume で SIGCONT を送信します。</span>
    <button type="button" id="resumeBtn">▶ resume</button>
  </div>
  <div id="term"></div>
  <form id="inputForm" autocomplete="off">
    <input type="text" id="inputText" placeholder="input to send..." spellcheck="false">
    <button type="submit" id="sendEnter">Send + Enter</button>
    <button type="button" id="sendRaw">Send (no Enter)</button>
    <button type="button" id="sendKey" title="送信するキーを prompt で入力 (例: Escape, Tab, Ctrl-C, C-a)">Send Key…</button>
  </form>
  <!-- 特殊キーパッド (iPad ソフトキーボードで打てない矢印 / Tab / Esc 等を補う)。
       button の data-spec 属性を POST /input の spec としてそのまま送る。
       hex:1b5b5a は Shift+Tab (= CSI Z / BackTab、input_bytes に key 名が無いので hex 直指定)。 -->
  <div id="keypad" class="keypad" aria-label="special key pad">
    <button type="button" data-spec="key:Up" title="Up (↑)">↑</button>
    <button type="button" data-spec="key:Down" title="Down (↓)">↓</button>
    <button type="button" data-spec="key:Left" title="Left (←)">←</button>
    <button type="button" data-spec="key:Right" title="Right (→)">→</button>
    <button type="button" data-spec="key:Tab" title="Tab">Tab</button>
    <button type="button" data-spec="hex:1b5b5a" title="Shift+Tab (CSI Z / BackTab)">⇧Tab</button>
    <button type="button" data-spec="key:Escape" title="Escape">Esc</button>
    <button type="button" data-spec="key:Enter" title="Enter">Enter</button>
    <button type="button" data-spec="key:Ctrl-C" title="Ctrl+C (SIGINT for cooked mode / raw ^C)">^C</button>
  </div>
  <p id="sendStatus" class="meta"></p>
  <details id="debugPanel">
    <summary>debug log (<span id="debugCount">0</span>)</summary>
    <pre id="debugLog"></pre>
  </details>
</main>
<script>
// devtools の無い環境 (iPad Safari 等) 向けのページ内デバッグ収集。
// uncaught error / unhandled rejection / console.error / xterm 初期化前の失敗を全部拾う。
(function () {
  const MAX = 200;
  const lines = [];
  function push(kind, msg) {
    const t = new Date().toISOString().slice(11, 23);
    lines.push(`${t} [${kind}] ${msg}`);
    if (lines.length > MAX) lines.shift();
    const pre = document.getElementById('debugLog');
    const cnt = document.getElementById('debugCount');
    if (pre) pre.textContent = lines.join('\n');
    if (cnt) cnt.textContent = String(lines.length);
  }
  window.__hyouiDebug = push;
  window.addEventListener('error', (e) => {
    push('error', `${e.message} @ ${e.filename}:${e.lineno}:${e.colno}`);
  }, true);
  window.addEventListener('unhandledrejection', (e) => {
    push('rejection', String(e.reason && (e.reason.stack || e.reason.message || e.reason)));
  });
  const origErr = console.error.bind(console);
  console.error = (...a) => { push('console', a.map(String).join(' ')); origErr(...a); };
  const origWarn = console.warn.bind(console);
  console.warn = (...a) => { push('warn', a.map(String).join(' ')); origWarn(...a); };
  window.addEventListener('DOMContentLoaded', () => {
    push('info', `ua=${navigator.userAgent}`);
    push('info', `viewport=${window.innerWidth}x${window.innerHeight} dpr=${devicePixelRatio}`);
    push('info', `xterm loaded=${typeof window.Terminal !== 'undefined'}`);
  });
})();
</script>
<script src="/assets/vendor/xterm.js"></script>
<script src="/assets/vendor/addon-unicode11.js"></script>
<script src="/assets/vendor/addon-fit.js"></script>
<script src="/assets/session.js"></script>
</body>
</html>
