<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="hyoui">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="/assets/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/assets/icon.svg">
<link rel="apple-touch-icon" href="/assets/icon.svg">
<title>hyoui web — sessions</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header>
  <h1>hyoui sessions</h1>
  <p class="meta">
    <!-- レイアウトシフト対策 (task 3) + PWA 用 reload (task 4)。詳細は session.html 参照。 -->
    <button id="reload" class="reload-btn" type="button" title="reload page (PWA 用)" aria-label="reload page">↻</button>
    <button id="refresh" type="button">refresh</button>
    <label><input type="checkbox" id="auto" checked> auto refresh</label>
    <span class="sep">·</span>
    <span id="status" class="status-text">loading…</span>
  </p>
</header>
<main>
  <table id="sessions">
    <thead>
      <tr>
        <th data-sort="session_id">session_id</th>
        <th data-sort="namespace">namespace</th>
        <th data-sort="status">status</th>
        <th data-sort="uptime" title="uptime since started">uptime</th>
        <th data-sort="clients" title="attached clients">clients</th>
        <th data-sort="suspend" title="on-child-suspend policy (notify: leader へ通知のみ / auto-resume: daemon が SIGCONT で復帰)">suspend</th>
        <th data-sort="version">version</th>
        <th data-sort="argv">argv</th>
        <th data-sort="cwd">cwd</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <p id="empty" class="empty" hidden>No sessions found. Start one with <code>hyoui run &lt;cmd&gt;</code>.</p>
</main>
<script src="/assets/index.js"></script>
</body>
</html>
