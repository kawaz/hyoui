[package]
name = "hyoui-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Drive `claude`, REPLs, and TUIs from the outside via CLI — a transparent PTY wrapper with no prefix keys (CLI binary)"

[[bin]]
name = "hyoui"
path = "src/main.rs"

[dependencies]
hyoui = { path = "../hyoui", version = "0.7" }
nix = { workspace = true }
# `screen snapshot` subcommand が `StateSnapshotResponse` を独立した CBOR root
# として出力するため、CBOR serialize の primitive を直接利用する (= DR-0013 §9)。
ciborium = { workspace = true }
# `wait` subcommand と `input` family の `wait:<pattern>` spec で visible state
# の正規表現マッチに用いる (= DR-0006 §9 state-based wait)。
regex = { workspace = true }
# `wait_core` の内部 CBOR デコード型 (= daemon の `ScreenSnapshot` 鏡像) を
# serde::Deserialize で取り回すために必要。
serde = { workspace = true }
# DR-0015 Task #N: `__daemonize-run` 子に init 情報 (= socket / session / size 等)
# を env シリアライズで渡す。JSON は env value の text-safe な serialize 形式として
# 採用 (= 独自 parse の脆さ回避、kawaz 指示 2026-05-29)。
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# integration tests (tests/lock_cli.rs) で nix::sys::signal::kill を使う
nix = { workspace = true }
# DR-0014 マトリクス検証用 PTY harness (tests/common/pty.rs)。
# - `insta`: screen dump snapshot 検証 (= zellij screen_tests pattern)
# - `pty-process`: PTY master / slave 操作の薄い wrapper (= blocking API、
#   `std::process::Child` をそのまま返す lean な設計)
insta = "1.47"
pty-process = "0.5"

[lints.rust]
unsafe_code = "forbid"
