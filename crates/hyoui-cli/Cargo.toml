[package]
name = "hyoui-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Drive `claude`, REPLs, and TUIs from the outside via CLI — a transparent PTY wrapper with no prefix keys (CLI binary)"

[[bin]]
name = "hyoui"
path = "src/main.rs"

[dependencies]
hyoui = { path = "../hyoui", version = "0.1" }
nix = { workspace = true }
# `screen snapshot` subcommand が `StateSnapshotResponse` を独立した CBOR root
# として出力するため、CBOR serialize の primitive を直接利用する (= DR-0013 §9)。
ciborium = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
