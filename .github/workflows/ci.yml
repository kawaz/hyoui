name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # release.yml が CI 一式を release gate として再利用するための呼び出し口
  workflow_call:

jobs:
  test:
    name: Test (${{ matrix.os }} / ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    # test hang 時に既定 6h まで runner を空焼きしない上限。通常 run は ~5-8 分
    # (rust-cache 有効時)。hang しても suite は fail として顕在化する。
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}-${{ matrix.rust }}
      - uses: extractions/setup-just@v3
      # just ci = lint (fmt + clippy + unsafe 封じ込め gate) + test + build。
      # ローカルと同一エントリで検査範囲を一致させる。
      - run: just ci

  ignored-tests:
    name: Ignored tests (${{ matrix.os }} / PTY+daemon)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}-stable
      - name: Run ignored integration tests (PTY/daemon)
        # step timeout にする理由: job timeout 超過は「cancelled」になり
        # continue-on-error で吸収されず workflow 全体が cancelled 表示になる。
        # step timeout なら step failure → job failure → continue-on-error で workflow は緑。
        timeout-minutes: 13
        run: cargo test --workspace -- --ignored

  msrv:
    name: MSRV check (rust-version = 1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-latest-1.88
      - name: cargo check on MSRV
        run: cargo check --workspace

  audit:
    name: cargo-audit (RUSTSEC advisories)
    runs-on: ubuntu-latest
    # rustsec/audit-check@v2 は check-run を作成するため checks:write が必要
    # (= 既定の read-only token では `Resource not accessible by integration` で失敗)
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v5
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: cargo-deny (licenses / bans / sources / advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
