name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }} / ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}-${{ matrix.rust }}
      - uses: extractions/setup-just@v3
      # just ci = lint (fmt + clippy + unsafe 封じ込め gate) + test + build。
      # ローカルと同一エントリで検査範囲を一致させる。
      - run: just ci

  ignored-tests:
    name: Ignored tests (${{ matrix.os }} / PTY+daemon)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}-stable
      - name: Run ignored integration tests (PTY/daemon)
        # step timeout にする理由: job timeout 超過は「cancelled」になり
        # continue-on-error で吸収されず workflow 全体が cancelled 表示になる。
        # step timeout なら step failure → job failure → continue-on-error で workflow は緑。
        timeout-minutes: 13
        run: cargo test --workspace -- --ignored

  msrv:
    name: MSRV check (rust-version = 1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-latest-1.88
      - name: cargo check on MSRV
        run: cargo check --workspace

  audit:
    name: cargo-audit (RUSTSEC advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: cargo-deny (licenses / bans / sources / advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
