name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unsafe-gate:
    name: unsafe confinement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify unsafe is confined to sys/raw.rs and sys/signal.rs
        run: |
          set -uo pipefail
          leaked=$(grep -rnE '\bunsafe[[:space:]]+(fn|impl|trait|extern|\{)' crates/hyoui/src --include='*.rs' \
            | grep -v 'src/sys/raw.rs\|src/sys/signal.rs' || true)
          if [ -n "$leaked" ]; then
            echo "ERROR: unsafe leaked outside whitelisted files (sys/raw.rs, sys/signal.rs):" >&2
            echo "$leaked" >&2
            exit 1
          fi

  test:
    name: Test (${{ matrix.os }} / ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}-${{ matrix.rust }}
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace
      - run: cargo test --workspace
