name: Release

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
  # workflow 自体の修正を Cargo.toml 変更なしで再走させる手動トリガ
  workflow_dispatch:

jobs:
  # CI 一式 (lint + test + msrv + audit + deny) を release の必須 gate にする。
  # build-release が needs で待つため、CI が green でない commit からは
  # release artifact が一切作られない。
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      checks: write # audit job (rustsec/audit-check) が check-run 作成に必要

  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.current }}
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # bump-semver の `vcs get latest-tag` で全 tag が必要

      # bump-semver を install (release flow が bump-semver に依存)。
      # 最新 release のバイナリを curl で取得 (linux-amd64)。
      - name: Install bump-semver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LATEST=$(gh release list --repo kawaz/bump-semver --limit 1 --json tagName -q '.[0].tagName' | sed 's/^v//')
          curl -fsSL --retry 5 --retry-delay 2 --max-time 60 \
            "https://github.com/kawaz/bump-semver/releases/download/v${LATEST}/bump-semver-linux-amd64" \
            -o /usr/local/bin/bump-semver
          chmod +x /usr/local/bin/bump-semver
          bump-semver --version

      - name: Check version change
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Cargo.toml workspace.package.version を正本として読む。
          # 要 bump-semver >= v0.38.0 (= GHA の run step は stdin が writer 不在の
          # FIFO になり、旧版は stdin pipe shortcut が誤発火して空読みする)
          CURRENT_VERSION=$(bump-semver get Cargo.toml --no-hint)
          echo "current=${CURRENT_VERSION}" >> "$GITHUB_OUTPUT"

          # ---- semver gate (= bump-semver DR-0039 canonical pattern) ----
          #
          # CURRENT_VERSION が「過去の release / tag いずれよりも大」を並列 check
          # する。両 source を短絡せず評価し、どちらかの gate を越えなかったら
          # release を作らない:
          #   - latest-release: GH の release 一覧 (= 過去リリース済 versions)
          #   - latest-tag    : git tag (= origin の git ref)
          #
          # なぜ両方必要か (= latest-tag 単独では不足):
          #   `gh release create` は GH 内部に release + tag object を作るが
          #   origin の git ref には tag を push しない (cli/cli#4357)。よって
          #   checkout 後の `vcs get latest-tag` が GH の最新 release より古い
          #   tag を返すケースがあり、そのギャップを latest-release が埋める。
          #
          # Design rationale (canonical との差分): 本リポの trigger は
          # paths [Cargo.toml] で、version bump を伴わない変更 (依存追加等)
          # でも発火する。そのため「現 version == 最新」は良性 skip
          # (changed=false, exit 0)、「現 version < 最新」のみ設定 error
          # (exit 1) に分ける。VERSION file trigger の canonical は常に
          # bump 意図なので gate 不通過 = 一律 error だが、ここでは過剰。
          FAIL=0
          SKIP=0
          check_axis() {
            local label="$1" latest="$2"
            echo "${label}: ${latest}"
            if bump-semver compare gt "$CURRENT_VERSION" "$latest" -qq; then
              : # CURRENT > latest: この軸は通過
            elif bump-semver compare eq "$CURRENT_VERSION" "$latest" -qq; then
              SKIP=1
            else
              echo "::error::v${CURRENT_VERSION} is less than ${label} v${latest}"
              FAIL=1
            fi
          }
          if LATEST_REL=$(bump-semver vcs get latest-release --repository "$REPO" 2>/dev/null); then
            check_axis "latest-release" "$LATEST_REL"
          else
            echo "latest-release: (none yet); bootstrap"
          fi
          if LATEST_TAG=$(bump-semver vcs get latest-tag --include-prerelease --vcs git 2>/dev/null); then
            check_axis "latest-tag" "$LATEST_TAG"
          else
            echo "latest-tag: (none yet, or transient migration); bootstrap"
          fi
          if [ "$FAIL" = "1" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ "$SKIP" = "1" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Version v${CURRENT_VERSION} is already the latest; release skip"
            exit 0
          fi

          # gh release で既存確認 (compare で通っても念のため二重防止)
          if gh release view "v${CURRENT_VERSION}" --repo "$REPO" >/dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Version unchanged: v${CURRENT_VERSION} already released"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "New version detected: v${CURRENT_VERSION}"
          fi

  build-release:
    needs: [check-version, ci]
    if: needs.check-version.outputs.changed == 'true'
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          CROSS: ${{ matrix.cross }}
        run: |
          if [ "$CROSS" = "true" ]; then
            cross build --release --workspace --target "$TARGET"
          else
            cargo build --release --workspace --target "$TARGET"
          fi

      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          ARCHIVE="hyoui-${VERSION}-${TARGET}.tar.gz"
          # Stage binary + LICENSE + README into a directory for clean archive layout
          STAGE=$(mktemp -d)
          cp "target/${TARGET}/release/hyoui" "$STAGE/"
          cp LICENSE README.md "$STAGE/"
          tar czf "$ARCHIVE" -C "$STAGE" .
          rm -rf "$STAGE"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ARCHIVE }}

  publish-release:
    needs: [check-version, build-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write       # required for sigstore signing (SLSA provenance)
      attestations: write   # required for actions/attest-build-provenance
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          sha256sum ./*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Generate SLSA build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            *.tar.gz
            SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.check-version.outputs.version }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          gh release create "v${VERSION}" \
            ./*.tar.gz SHA256SUMS \
            --repo "$REPO" \
            --title "v${VERSION}" \
            --target "$COMMIT_SHA" \
            --generate-notes

  update-homebrew:
    needs: [check-version, publish-release]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Calculate checksums
        id: checksums
        run: |
          set -euo pipefail
          {
            echo "darwin_arm64=$(sha256sum artifacts/aarch64-apple-darwin/*.tar.gz | cut -d' ' -f1)"
            echo "darwin_amd64=$(sha256sum artifacts/x86_64-apple-darwin/*.tar.gz | cut -d' ' -f1)"
            echo "linux_arm64=$(sha256sum artifacts/aarch64-unknown-linux-gnu/*.tar.gz | cut -d' ' -f1)"
            echo "linux_amd64=$(sha256sum artifacts/x86_64-unknown-linux-gnu/*.tar.gz | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew-tap
        uses: actions/checkout@v5
        with:
          repository: kawaz/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: homebrew-tap

      - name: Update formula
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
          DARWIN_ARM64: ${{ steps.checksums.outputs.darwin_arm64 }}
          DARWIN_AMD64: ${{ steps.checksums.outputs.darwin_amd64 }}
          LINUX_ARM64: ${{ steps.checksums.outputs.linux_arm64 }}
          LINUX_AMD64: ${{ steps.checksums.outputs.linux_amd64 }}
        run: |
          cat > homebrew-tap/Formula/hyoui.rb <<FORMULA
          class Hyoui < Formula
            desc "Drive claude, REPLs, and TUIs from the outside via CLI - a transparent PTY wrapper with no prefix keys"
            homepage "https://github.com/kawaz/hyoui"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/kawaz/hyoui/releases/download/v#{version}/hyoui-#{version}-aarch64-apple-darwin.tar.gz"
                sha256 "${DARWIN_ARM64}"
              end
              on_intel do
                url "https://github.com/kawaz/hyoui/releases/download/v#{version}/hyoui-#{version}-x86_64-apple-darwin.tar.gz"
                sha256 "${DARWIN_AMD64}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/kawaz/hyoui/releases/download/v#{version}/hyoui-#{version}-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${LINUX_ARM64}"
              end
              on_intel do
                url "https://github.com/kawaz/hyoui/releases/download/v#{version}/hyoui-#{version}-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${LINUX_AMD64}"
              end
            end

            def install
              bin.install "hyoui"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/hyoui --version")
            end
          end
          FORMULA

      - name: Commit and push formula
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/hyoui.rb
          git diff --staged --quiet || git commit -m "Update hyoui to ${VERSION}"
          git push
