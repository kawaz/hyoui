<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<title>softkey iframe focus PoC</title>
<style>
  html, body { margin: 0; height: 100%; font: 12px/1.3 ui-monospace, Menlo, monospace; }
  body { display: flex; flex-direction: column; }
  #status { padding: 4px; background: #222; color: #eee; display: flex; flex-wrap: wrap; gap: 4px 12px; }
  #status b { color: #ff0; }
  #status a { color: #8cf; }
  #panes { display: flex; flex-direction: column; gap: 2px; padding: 2px; }
  iframe { width: 100%; height: 150px; border: 2px solid #999; box-sizing: border-box; }
  iframe.last { border-color: #2a2; }
  #log { flex: 1; overflow: auto; margin: 0 2px; background: #f4f4f4; white-space: pre-wrap; padding-bottom: 180px; }
  /* iOS ではソフトキーボード表示中も layout viewport は縮まないため、visualViewport に追従させて JS で持ち上げる */
  #panel { position: fixed; left: 0; right: 0; bottom: 0; background: #ddd; border-top: 1px solid #888; padding: 4px; display: flex; flex-direction: column; gap: 4px; }
  .row { display: flex; gap: 4px; align-items: center; }
  .row .label { width: 9em; flex: none; font-size: 11px; }
  .row .res { width: 3em; flex: none; text-align: center; font-weight: bold; }
  .res.ok { color: #080; } .res.ng { color: #c00; }
  .key { flex: 1; min-width: 0; padding: 8px 0; font: inherit; font-size: 13px; text-align: center; background: #fff; border: 1px solid #888; border-radius: 4px; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
</style>
</head>
<body>
<div id="status">
  <span>focus frame: <b id="st-focus">-</b></span>
  <span>最後の pane: <b id="st-last">-</b></span>
  <span>キーボード(推定): <b id="st-kbd">-</b></span>
  <span id="st-vv"></span>
  <span>pane B: <a href="?b=textarea">textarea</a> / <a href="?b=xterm">xterm</a> | <a href="#" id="clear">log clear</a></span>
</div>
<div id="panes">
  <iframe id="frame-A" src="pane.html?name=A"></iframe>
  <iframe id="frame-B"></iframe>
</div>
<pre id="log"></pre>
<div id="panel"></div>
<script type="module" src="index.js"></script>
</body>
</html>
