[workspace]
resolver = "2"
members = ["crates/hyoui", "crates/hyoui-cli"]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.86"
license = "MIT"
authors = ["Yoshiaki Kawazu <kawazzz@gmail.com>"]
repository = "https://github.com/kawaz/hyoui"
description = "Suspendable wrapper around interactive PTY processes"

[workspace.dependencies]
nix = { version = "0.31", default-features = false, features = [
    "fs",
    "poll",
    "process",
    "signal",
    "socket",
    "net",
    "term",
    "time",
    "event",
    "user",
    "ioctl",
] }
libc = "0.2"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
ciborium = "0.2"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl"] }

[workspace.dependencies.tempfile]
version = "3"

[workspace.dependencies.hex]
version = "0.4"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 0
