[workspace]
resolver = "2"
members = ["crates/hyoui", "crates/hyoui-cli", "crates/hyoui-web"]

[workspace.package]
version = "0.9.25"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Yoshiaki Kawazu <kawazzz@gmail.com>"]
repository = "https://github.com/kawaz/hyoui"
description = "Drive `claude`, REPLs, and TUIs from the outside via CLI — a transparent PTY wrapper with no prefix keys"

[workspace.dependencies]
nix = { version = "0.31", default-features = false, features = [
    "fs",
    "poll",
    "process",
    "signal",
    "socket",
    "net",
    "term",
    "time",
    "event",
    "user",
    "ioctl",
] }
libc = "0.2"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"
serde_bytes = "0.11"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl"] }
vt100 = "0.16"
crossbeam-channel = "0.5"
uuid = { version = "1", features = ["v4"] }

[workspace.dependencies.tempfile]
version = "3"

[workspace.dependencies.hex]
version = "0.4"

[workspace.dependencies.toml]
version = "0.9"
default-features = false
features = ["parse", "display", "serde"]

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 0
